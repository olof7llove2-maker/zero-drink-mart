<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>375px 미리보기 (임시)</title>
<style>
  html, body { margin: 0; padding: 0; background: #d9d9d9; }
  iframe { display: block; width: 375px; height: 100vh; border: 0; background: #fff; }
</style>
</head>
<body>
<iframe id="f" src="/?cb=v375r14"></iframe>
<script>
  /* 375px 검증용 임시 페이지 (확인 뒤 삭제)
     ?to=섹션ID  : 그 섹션을 헤더 아래에 맞춰 스크롤
     ?y=절대값   : 그 스크롤 위치로 바로 이동 */
  (function () {
    var q = new URLSearchParams(location.search);
    var to = q.get("to") || "home-protein";
    var y = q.get("y");
    var f = document.getElementById("f");
    f.addEventListener("load", function () {
      var w = f.contentWindow;
      var tries = 0;
      (function move() {
        try {
          var d = f.contentDocument;
          var el = d.getElementById(to);
          if (y !== null) {
            w.scrollTo(0, Number(y) || 0);
          } else if (el && el.offsetHeight > 60) {
            w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 74);
          } else {
            if (tries++ < 50) setTimeout(move, 150);
            return;
          }
          if (tries++ < 6) setTimeout(move, 400);
        } catch (e) {
          if (tries++ < 50) setTimeout(move, 150);
        }
      })();
    });
  })();
</script>
</body>
</html>
