<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>띠니마트 모바일 미리보기</title>
<style>
  body { margin: 0; background: #ddd; font: 12px/1.4 sans-serif; display: flex; gap: 10px; padding: 10px; }
  figure { margin: 0; }
  figcaption { padding: 4px 6px; font-weight: 700; }
  iframe { width: 390px; height: 760px; border: 0; background: #fff; box-shadow: 0 0 8px rgba(0,0,0,.25); }
</style>
</head>
<body>
<script>
  const ALL = [
    ["home", "홈", "/?tab=home&v=p1"],
    ["category", "카테고리", "/?tab=category&part=protein&v=p1"],
    ["ranking", "랭킹", "/?tab=ranking&v=p1"],
    ["hotdeal", "핫딜", "/?tab=hotdeal&v=p1"],
  ];
  const want = (new URLSearchParams(location.search).get("f") || "home").split(",");
  ALL.filter(([id]) => want.includes(id)).forEach(([id, label, src]) => {
    const fig = document.createElement("figure");
    fig.innerHTML = `<figcaption>${label}</figcaption>`;
    const frame = document.createElement("iframe");
    frame.src = src;
    fig.appendChild(frame);
    document.body.appendChild(fig);
  });
</script>
</body>
</html>
