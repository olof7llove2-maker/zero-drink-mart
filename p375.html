<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>375px 미리보기 (임시 · r18 확인)</title>
<style>
  html, body { margin: 0; background: #ddd; font: 12px system-ui; }
  .wrap { display: flex; gap: 12px; padding: 10px; }
  iframe { width: 375px; height: 812px; border: 0; background: #fff; }
  .lab { font-weight: 700; margin-bottom: 4px; }
  #info { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-width: 460px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="lab">375 × 812</div>
    <iframe id="f" src="/"></iframe>
  </div>
  <div>
    <div class="lab">측정</div>
    <div id="info">…</div>
  </div>
</div>
<script>
  const f = document.getElementById('f');
  const info = document.getElementById('info');
  const qs = new URLSearchParams(location.search);
  const open = qs.get('open');
  const sel = qs.get('sel') || '#home-spot';
  const yOff = parseInt(qs.get('y') || '-6', 10);

  f.addEventListener('load', () => {
    setTimeout(() => {
      const d = f.contentDocument, w = f.contentWindow;
      let msg = `scrollWidth ${d.documentElement.scrollWidth} / client ${d.documentElement.clientWidth}\n`;
      msg += `가로 오버플로 ${d.documentElement.scrollWidth > d.documentElement.clientWidth ? '⚠️ 있음' : '없음'}\n`;
      if (open === 'hub') {
        const btn = d.getElementById('alert-cta');
        if (btn) btn.click();
        msg += `hub hidden=${d.getElementById('hub-modal') ? d.getElementById('hub-modal').hidden : 'none'}\n`;
      }
      const el = sel ? d.querySelector(sel) : null;
      if (el) {
        const top = el.getBoundingClientRect().top + w.scrollY + yOff;
        w.scrollTo(0, Math.max(0, top));
      }
      msg += `scrollY ${w.scrollY}\n`;
      const cards = [...d.querySelectorAll('.spot-card')];
      msg += `spot 카드 ${cards.length}개\n`;
      cards.forEach((c, i) => {
        const tag = c.querySelector('.spot-tag');
        msg += `${i + 1}. [${tag ? tag.textContent : '-'}] ${c.querySelector('.spot-name').textContent.slice(0, 28)}\n`;
      });
      const rail = d.querySelector('.spot-rail');
      if (rail) msg += `rail scroll ${rail.scrollWidth} / ${rail.clientWidth}\n`;
      info.textContent = msg;
    }, 1800);
  });
</script>
</body>
</html>
