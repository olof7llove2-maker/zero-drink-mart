<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>375px 미리보기 (임시 · r17 확인)</title>
<style>
  html, body { margin: 0; background: #ddd; font: 12px system-ui; }
  .wrap { display: flex; gap: 12px; padding: 10px; }
  iframe { width: 375px; height: 812px; border: 0; background: #fff; }
  .lab { font-weight: 700; margin-bottom: 4px; }
  #info { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-width: 420px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="lab">375 × 812</div>
    <iframe id="f" src="/"></iframe>
  </div>
  <div>
    <div class="lab">측정</div>
    <div id="info">…</div>
  </div>
</div>
<script>
  const f = document.getElementById('f');
  const info = document.getElementById('info');
  const qs = new URLSearchParams(location.search);
  const open = qs.get('open');           // hub → 알림 허브 시트 열기
  const ios = qs.get('ios');             // 1 → 아이폰 환경으로 흔내 보기(확인용)
  const scrollTo = qs.get('sel');
  const yOff = parseInt(qs.get('y') || '0', 10);

  f.addEventListener('load', () => {
    setTimeout(() => {
      const d = f.contentDocument, w = f.contentWindow;
      let msg = `scrollWidth ${d.documentElement.scrollWidth} / client ${d.documentElement.clientWidth}\n`;
      msg += `가로 오버플로 ${d.documentElement.scrollWidth > d.documentElement.clientWidth ? '⚠️ 있음' : '없음'}\n`;
      if (ios === '1') {
        w.deviceEnv = () => ({ iOS: true, android: false, inApp: false, mac: false });
        w.isStandalone = () => false;
        msg += `iOS 환경 흔내(홈 화면 앱 아님)\n`;
      }
      if (open === 'hub') {
        const btn = d.getElementById('alert-cta');
        if (btn) btn.click();
        msg += `hub hidden=${d.getElementById('hub-modal') ? d.getElementById('hub-modal').hidden : 'none'}\n`;
        const card = d.querySelector('.hot-card');
        msg += `hot-card=${card ? '있음' : '없음'}\n`;
      }
      if (scrollTo) {
        const el = d.querySelector(scrollTo);
        if (el) {
          const top = el.getBoundingClientRect().top + w.scrollY + yOff;
          w.scrollTo(0, top);
        }
      }
      info.textContent = msg;
    }, 1600);
  });
</script>
</body>
</html>
