<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>375px 미리보기 (임시)</title>
<style>
  html, body { margin: 0; background: #ddd; font: 12px system-ui; }
  .wrap { display: flex; gap: 12px; padding: 10px; }
  iframe { width: 390px; height: 812px; border: 0; background: #fff; }
  .lab { font-weight: 700; margin-bottom: 4px; }
  #info { font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-width: 420px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="lab">375 × 812 (iframe 390 = 내용 375)</div>
    <iframe id="f" src="/"></iframe>
  </div>
  <div>
    <div class="lab">측정</div>
    <div id="info">…</div>
  </div>
</div>
<script>
  const f = document.getElementById('f');
  const info = document.getElementById('info');
  const qs = new URLSearchParams(location.search);
  const scrollTo = qs.get('sel');       // CSS selector to scroll into view
  const yOff = parseInt(qs.get('y') || '0', 10);

  f.addEventListener('load', () => {
    setTimeout(() => {
      const d = f.contentDocument, w = f.contentWindow;
      let msg = `내용 폭 ${d.documentElement.clientWidth} · scrollWidth ${d.documentElement.scrollWidth}\n`;
      msg += `body scrollWidth ${d.body.scrollWidth}\n`;
      msg += `가로 오버플로 ${d.documentElement.scrollWidth > d.documentElement.clientWidth ? '⚠️ 있음' : '없음'}`;
      info.textContent = msg;
      if (scrollTo) {
        const el = d.querySelector(scrollTo);
        if (el) {
          const top = el.getBoundingClientRect().top + w.scrollY + yOff;
          w.scrollTo(0, top);
        }
      }
    }, 1200);
  });
</script>
</body>
</html>
