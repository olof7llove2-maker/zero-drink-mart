<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>375px 미리보기</title>
<style>
  html, body { margin: 0; background: #d9d5cc; font: 12px/1.4 sans-serif; }
  .wrap { display: flex; gap: 14px; justify-content: center; padding: 12px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 4px; }
  .cap { font-size: 11px; font-weight: 700; color: #4b463c; text-align: center; }
  .frame { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.22); border-radius: 8px; overflow: hidden; }
  iframe { display: block; width: 375px; height: 1900px; border: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <p class="cap">① 홈 (기본)</p>
      <div class="frame"><iframe src="/?tab=home" title="띠니마트 375px 미리보기 · 홈"></iframe></div>
    </div>
    <div class="col">
      <p class="cap">② 홈 · 🥗 다이어트·저당 선택</p>
      <div class="frame"><iframe src="/?tab=home&goal=diet" title="띠니마트 375px 미리보기 · 다이어트"></iframe></div>
    </div>
  </div>
</body>
</html>
